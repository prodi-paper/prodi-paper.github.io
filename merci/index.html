<title>Merci — Prodiconseil</title>
<link rel="icon" type="image/png" href="/img/panda.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'DM Sans',sans-serif;background:#fff;color:#222;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;box-sizing:border-box;}
  .logo{height:34px;margin-bottom:42px;}
  .ok-check{width:74px;height:74px;margin-bottom:26px;}
  .ok-check circle{fill:none;stroke:#1da851;stroke-width:2.4;stroke-dasharray:158;stroke-dashoffset:158;animation:draw .7s ease forwards;}
  .ok-check path{fill:none;stroke:#1da851;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:36;stroke-dashoffset:36;animation:draw .45s ease .55s forwards;}
  @keyframes draw{to{stroke-dashoffset:0;}}
  h1{font-size:30px;margin:0 0 12px;font-weight:700;}
  p{font-size:16.5px;color:#6e6e73;line-height:1.55;margin:0 0 34px;max-width:440px;}
  a.btn{display:inline-block;background:#222;color:#fff;text-decoration:none;border-radius:999px;padding:13px 30px;font-weight:600;font-size:15px;}
</style>
</head>
<body>
  <img class="logo" src="/img/logo.png" alt="Prodiconseil">
  <svg class="ok-check" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="25"/><path d="M14 27l8 8 16-16"/></svg>
  <h1>Merci&nbsp;!</h1>
  <p>Votre demande est bien reçue. Un expert Prodiconseil vous recontacte très vite avec une offre adaptée.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
  <script>
  /* Porte stock (23/08) : après le formulaire « Accéder au stock » on passe
     ici (conversion Ads par simple visite de /merci/) puis on enchaîne sur
     le catalogue sans prix. */
  (function(){
    if(new URLSearchParams(location.search).get('next')!=='stock')return;
    function go(){
      var p=document.querySelector('p');
      if(p)p.textContent='Votre accès au stock est ouvert. Un expert Prodiconseil vous recontacte très vite.';
      var b=document.querySelector('a.btn');
      if(b){b.href='/catalogue/';b.textContent='Voir le stock →';}
      setTimeout(function(){location.href='/catalogue/';},1600);
    }
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go();
  })();
  </script>
  <script src="/analytics.js" defer></script>
</body>
