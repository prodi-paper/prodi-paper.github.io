<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Offres Intelligence — Prodi</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--ink:#222;--g2:#6e6e73;--bg:#f5f5f7;--border:#EBEBEB;--red:#FE0000;--green:#1d7a2e;--blue:#1d4fa8;
  --shadow:0 1px 8px rgba(0,0,0,.06);--gab:min(1515px,100vw - 32px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--ink);}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.header-inner{max-width:var(--gab);margin:0 auto;height:64px;display:flex;align-items:center;gap:15px;padding:0 26px;}
.header-inner img{height:40px;width:auto;display:block;}
.header-inner .htitre{font-family:'Bebas Neue',sans-serif;font-size:31px;letter-spacing:1.3px;margin-left:2px;padding-top:3px;white-space:nowrap;}
.maj{font-size:13.5px;font-weight:800;padding:6px 13px;border-radius:999px;white-space:nowrap;background:#e7f4ea;color:var(--green);}
.maj.vieux{background:#fdeeea;color:#c33c10;}
#q{margin-left:auto;height:42px;width:min(360px,34vw);border:1.5px solid #d2d2d7;border-radius:999px;padding:0 18px;font-size:15.5px;font-family:'DM Sans',sans-serif;outline:none;background:#fff;}
#q:focus{border-color:#1d1d1f;}
.wrap{max-width:var(--gab);margin:0 auto;padding:20px 26px 90px;}

.seg-t{font-family:'Bebas Neue',sans-serif;font-size:27px;letter-spacing:1px;display:flex;align-items:baseline;gap:10px;padding:0 0 8px;border-bottom:2px solid var(--ink);margin:30px 0 12px;}
.seg-t:first-child{margin-top:4px;}
.seg-t .count{font-family:'DM Sans',sans-serif;font-size:13.5px;color:var(--g2);font-weight:700;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;}
.grid.large{grid-template-columns:repeat(auto-fill,minmax(400px,1fr));}

.card{border:1px solid rgba(0,0,0,.05);border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.10);padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px;}
.card.vide{opacity:.55;}
.c-head{display:flex;align-items:baseline;gap:9px;min-width:0;}
.c-titre{font-size:17.5px;font-weight:800;line-height:1.15;flex:1;min-width:0;}
.c-code{flex:none;font-size:12.5px;font-weight:800;letter-spacing:.4px;background:#222;color:#fff;border-radius:7px;padding:3px 8px;}
.c-tons{flex:none;font-size:17px;font-weight:800;color:var(--green);white-space:nowrap;}
.c-stats{font-size:13.5px;color:var(--g2);font-weight:600;}
.c-stats b{color:var(--ink);}
.files{display:flex;flex-direction:column;margin-top:auto;}
.fl{display:flex;align-items:center;gap:9px;padding:8px 4px;border-top:1px dashed #e4e4e8;cursor:pointer;text-decoration:none;color:var(--ink);border-radius:7px;}
.fl:first-child{border-top:none;}
.fl:hover{background:#f2f2f4;}
.fl:hover .fln{text-decoration:underline;}
.fl .ico{flex:none;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:#e7f4ea;color:var(--green);font-size:14px;font-weight:800;}
.fl.fab .ico{background:#e8effc;color:var(--blue);}
.fl .fln{font-size:14.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fl .fli{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--g2);white-space:nowrap;}
.fl .fli.alerte{color:#c33c10;}
.fl .dlok{color:var(--green);font-weight:800;font-size:12.5px;white-space:nowrap;}
.nores{margin:40px 0;text-align:center;font-size:16px;color:var(--g2);font-weight:600;display:none;}
</style>
</head>
<body>
<script>
/* localhost = mode dev : pas de porte, index + fichiers locaux */
window._LOCAL=/^(localhost|127\.)/.test(location.hostname);
(function(){try{if(window._LOCAL||localStorage.getItem('prodi_offres_code'))document.documentElement.classList.add('cat-unlocked');}catch(e){}})();
</script>
<style>
#cat-gate{position:fixed;inset:0;z-index:100000;background:#F5F3EE;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
html.cat-unlocked #cat-gate{display:none !important;}
.cat-gate-card{background:#fff;border-radius:20px;box-shadow:0 16px 44px rgba(0,0,0,.16);padding:38px 34px 28px;width:100%;max-width:370px;text-align:center;box-sizing:border-box;}
.cat-gate-logo{height:32px;margin-bottom:16px;}
.cat-gate-t{font-size:22px;font-weight:800;color:#1d1d1f;letter-spacing:-.3px;}
.cat-gate-s{font-size:13.5px;color:#86868b;margin:7px 0 20px;line-height:1.4;}
#cat-gate-form{display:flex;flex-direction:column;gap:10px;}
#cat-gate-input{height:46px;border:1.5px solid #e0e0e5;border-radius:12px;padding:0 16px;font-size:16px;outline:none;box-sizing:border-box;text-align:center;}
#cat-gate-input:focus{border-color:#1d1d1f;}
#cat-gate-form button{height:46px;border:none;border-radius:12px;background:#1d1d1f;color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.cat-gate-err{color:#FE0000;font-size:13px;font-weight:600;min-height:17px;margin-top:11px;}
.cat-gate-shake{animation:catShake .34s;}
@keyframes catShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>
<div id="cat-gate">
  <div class="cat-gate-card">
    <img src="logo.png" alt="Prodiconseil" class="cat-gate-logo">
    <div class="cat-gate-t">Accès réservé</div>
    <div class="cat-gate-s">Outil interne Prodiconseil.<br>Entrez le code d'accès pour continuer.</div>
    <form id="cat-gate-form" autocomplete="off">
      <input type="password" id="cat-gate-input" placeholder="Code d'accès" autocomplete="off" spellcheck="false">
      <button type="submit">Confirmer</button>
    </form>
    <div class="cat-gate-err" id="cat-gate-err"></div>
  </div>
</div>
<script>
(function(){
  window._OFFRES_API='https://bvcgpdoukhcatjibmvnb.supabase.co/functions/v1/offres';
  try{window._OFFRES_CODE=localStorage.getItem('prodi_offres_code')||'';}catch(e){window._OFFRES_CODE='';}
  function boot(){
    var g=document.getElementById('cat-gate'),f=document.getElementById('cat-gate-form'),i=document.getElementById('cat-gate-input'),err=document.getElementById('cat-gate-err');
    if(!f)return;
    if(!window._LOCAL)setTimeout(function(){try{i.focus();}catch(e){}},60);
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var code=i.value.trim();if(!code)return;
      err.textContent='Vérification…';
      fetch(window._OFFRES_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:code,action:'check'})})
        .then(function(r){return r.json();})
        .then(function(d){
          if(d&&d.ok){
            window._OFFRES_CODE=code;err.textContent='';
            try{localStorage.setItem('prodi_offres_code',code);localStorage.setItem('prodi_cat_ok','1');}catch(e){}
            document.documentElement.classList.add('cat-unlocked');
            if(window._chargerDonnees)window._chargerDonnees();
          }else{
            err.textContent='Code incorrect';
            var card=g.querySelector('.cat-gate-card');card.classList.remove('cat-gate-shake');void card.offsetWidth;card.classList.add('cat-gate-shake');i.select();
          }
        })
        .catch(function(){err.textContent='Erreur réseau — réessayez';});
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
<script>
(function(){function fit(){var z=Math.max(1,Math.min(window.innerWidth/1550,window.innerHeight/860,1.6));document.body.style.zoom=z>1.01?z:'';}fit();window.addEventListener('resize',fit);})();
</script>

<header>
  <div class="header-inner">
    <img src="logo.png" alt="Prodiconseil">
    <span class="htitre">OFFRES INTELLIGENCE</span>
    <span class="maj" id="maj"></span>
    <input id="q" type="search" placeholder="Chercher une qualité… (kraft, autocopiant, RCAR…)">
  </div>
</header>

<div class="wrap">
  <div id="contenu"></div>
  <div class="nores" id="nores">Aucune offre ne correspond.</div>
</div>

<script>
let DATA=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const nT=t=>t==null?'':(t>=100?Math.round(t).toLocaleString('fr-FR'):t.toLocaleString('fr-FR'))+' t';
const nR=n=>n.toLocaleString('fr-FR');
const dFr=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?m[3]+'/'+m[2]:'';};
/* libellé FR = partie avant le tiret-espace ("AUTOCOPIANT EN BOBINE - REEL …") ;
   les tirets collés (GC1-GC2, BLANCHI-) ne coupent pas */
const labFr=s=>(s||'').split(/\s*-\s+/)[0].replace(/\s+/g,' ').trim();

function chargerDonnees(){
  const apres=d=>{DATA=d;render('');document.getElementById('q').addEventListener('input',e=>render(e.target.value));};
  if(window._LOCAL){fetch('depot_index.json',{cache:'no-store'}).then(r=>r.json()).then(apres);return;}
  fetch(window._OFFRES_API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({code:window._OFFRES_CODE,action:'index'})})
    .then(r=>{if(r.status===403){window._OFFRES_CODE='';try{localStorage.removeItem('prodi_offres_code');}catch(e){}
      document.documentElement.classList.remove('cat-unlocked');throw 0;}return r.json();})
    .then(apres).catch(()=>{});
}
window._chargerDonnees=chargerDonnees;

/* groupes = un par code qualité (ou un par fichier sans code) */
function groupes(fs){
  const map=new Map();
  fs.forEach(f=>{
    const k=f.code||('~'+f.nom);
    if(!map.has(k))map.set(k,{code:f.code,fichiers:[]});
    map.get(k).fichiers.push(f);
  });
  return [...map.values()].map(g=>{
    g.stock=g.fichiers.filter(f=>!f.fab);g.fabs=g.fichiers.filter(f=>f.fab);
    const base=g.stock[0]||g.fichiers[0];
    g.titre=labFr(base.label)||g.code;
    g.tons=g.stock.reduce((s,f)=>s+(f.tonnes||0),0)||null;
    g.refs=g.stock.reduce((s,f)=>s+f.refs,0);
    const gs=g.stock.filter(f=>f.gmin!=null),ps=g.stock.filter(f=>f.pmin!=null);
    g.gmin=gs.length?Math.min(...gs.map(f=>f.gmin)):null;g.gmax=gs.length?Math.max(...gs.map(f=>f.gmax)):null;
    g.pmin=ps.length?Math.min(...ps.map(f=>f.pmin)):null;g.pmax=ps.length?Math.max(...ps.map(f=>f.pmax)):null;
    g.texte=norm(g.fichiers.map(f=>f.nom+' '+f.label).join(' ')+' '+(g.code||''));
    return g;
  }).sort((a,b)=>(b.tons||0)-(a.tons||0)||a.titre.localeCompare(b.titre));
}

function ligneFichier(f,libelle,classes){
  const href=window._LOCAL?('depot/'+encodeURIComponent(f.nom)):'#';
  const stats=f.refs?`${nR(f.refs)} réf${f.refs>1?'s':''}${f.tonnes?' · '+nT(f.tonnes):''}`:'vide';
  const vieux=DATA.stock_date&&f.modif<DATA.stock_date;
  return `<a class="fl ${classes||''}" href="${href}" ${window._LOCAL?`download="${esc(f.nom)}"`:''} data-key="${esc(f.key)}" data-nom="${esc(f.nom)}" title="${esc(f.nom)}">
    <span class="ico">⬇</span><span class="fln">${esc(libelle)}</span>
    <span class="fli${vieux?' alerte':''}">${vieux?'⚠️ '+dFr(f.modif):stats}</span></a>`;
}

function carte(g){
  if(!g.refs)return '';               /* offre vide → pas affichée */
  const plein=g.stock.filter(f=>f.refs);
  let lignes='';
  if(plein.length===1)lignes+=ligneFichier(plein[0],'Télécharger l’offre');
  else plein.forEach(f=>lignes+=ligneFichier(f,labFr(f.label)));
  return `<div class="card" data-txt="${g.texte}">
    <div class="c-head"><span class="c-titre">${esc(g.titre)}</span>${g.code?`<span class="c-code">${esc(g.code)}</span>`:''}${g.tons?`<span class="c-tons">${nT(g.tons)}</span>`:''}</div>
    <div class="files">${lignes}</div></div>`;
}

function render(q){
  const R=document.getElementById('contenu');R.innerHTML='';
  const fs=DATA.fichiers;
  const sd=DATA.stock_date,auj=new Date().toISOString().slice(0,10);
  const maj=document.getElementById('maj');
  maj.textContent='Stock du '+(sd?sd.split('-').reverse().join('/'):'?');
  maj.classList.toggle('vieux',sd!==auj);

  let html='';
  const bloc=(titre,cartes,large)=>{if(!cartes)return;
    html+=`<div class="seg-t sec">${titre}</div><div class="grid${large?' large':''}">${cartes}</div>`;};

  bloc('Bobines',groupes(fs.filter(f=>f.section==='bobines')).map(carte).join(''));
  bloc('Feuilles & palettes',groupes(fs.filter(f=>f.section==='feuilles')).map(carte).join(''));
  R.innerHTML=html;

  /* recherche : filtre les cartes, masque les sections vides */
  const Q=norm(q||'').trim();
  if(Q){let tot=0;
    R.querySelectorAll('.card').forEach(c=>{const on=c.dataset.txt.includes(Q);c.style.display=on?'':'none';if(on)tot++;});
    R.querySelectorAll('.seg-t.sec').forEach(t=>{
      const g=t.nextElementSibling;
      const vis=[...g.querySelectorAll('.card')].some(c=>c.style.display!=='none');
      t.style.display=vis?'':'none';g.style.display=vis?'':'none';});
    document.getElementById('nores').style.display=tot?'none':'block';
  }else document.getElementById('nores').style.display='none';

  /* téléchargements en ligne : lien signé 1h via l'Edge Function */
  R.querySelectorAll('a.fl').forEach(a=>a.addEventListener('click',e=>{
    if(a.querySelector('.dlok'))return;
    const ok=()=>{const s=document.createElement('span');s.className='dlok';s.textContent='✓';
      a.appendChild(s);setTimeout(()=>s.remove(),2200);};
    if(window._LOCAL){ok();return;}
    e.preventDefault();
    fetch(window._OFFRES_API,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:window._OFFRES_CODE,action:'sign',key:a.dataset.key,nom:a.dataset.nom||''})})
      .then(r=>r.json()).then(d=>{if(d&&d.ok&&d.url){ok();location.href=d.url;}});
  }));
}

if(window._LOCAL||window._OFFRES_CODE)chargerDonnees();
</script>
</body>
</html>
